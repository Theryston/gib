[package]
name = "gib-sdk"
version = "0.0.45"
edition = "2024"
description = "⚡ Back up your files. Keep them in sync. Travel through their history."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Theryston/gib"

[features]
default = ["cli"]
cli = [
    "dep:bytesize",
    "dep:clap",
    "dep:console",
    "dep:crossterm",
    "dep:dialoguer",
    "dep:indicatif",
]

[lib]
name = "gib"
path = "src/lib.rs"

[[bin]]
name = "gib"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.83"
aws-config = "1.8.12"
aws-credential-types = "1.2.11"
aws-sdk-s3 = { version = "1.119.0", features = ["behavior-version-latest"] }
aws-types = "1.3.11"
bytes = "1.11.0"
bytesize = { version = "2.3.1", optional = true }
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.54", optional = true }
crossterm = { version = "0.29.0", optional = true }
console = { version = "0.16.2", optional = true }
dialoguer = { version = "0.12.0", optional = true }
dirs = "6.0.0"
hex-literal = "1.1.0"
indicatif = { version = "0.18.3", optional = true }
parse-size = "1.1.0"
rand_core = { version = "0.9.5", features = ["std"] }
regex = "1.12.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5.0"
zstd = "0.13.3"
futures = "0.3.31"
chrono = "0.4.43"
num_cpus = "1.17.0"
toml = "0.8.23"
percent-encoding = "2.3.1"
quick-xml = "0.37.5"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
url = "2.5.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
