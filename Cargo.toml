[package]
name = "gib"
version = "0.0.42"
edition = "2024"

[features]
# The in-process runtime is always available on the default CPU build. Native
# accelerator backends remain opt-in so they do not make the release matrix
# depend on a local GPU SDK.
default = ["ai-cpu"]
ai-cpu = []
ai-openmp = ["llama-cpp-2/openmp", "llama-cpp-sys-2/openmp"]
ai-cuda = ["llama-cpp-2/cuda", "llama-cpp-sys-2/cuda"]
ai-cuda-no-vmm = ["ai-cuda", "llama-cpp-2/cuda-no-vmm", "llama-cpp-sys-2/cuda-no-vmm"]
ai-metal = ["llama-cpp-2/metal", "llama-cpp-sys-2/metal"]
ai-vulkan = ["llama-cpp-2/vulkan", "llama-cpp-sys-2/vulkan"]
ai-opencl = ["llama-cpp-2/opencl", "llama-cpp-sys-2/opencl"]
ai-rocm = ["llama-cpp-2/rocm", "llama-cpp-sys-2/rocm"]
ai-mkl = ["llama-cpp-2/mkl", "llama-cpp-sys-2/mkl"]

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.83"
aws-config = "1.8.12"
aws-credential-types = "1.2.11"
aws-sdk-s3 = { version = "1.119.0", features = ["behavior-version-latest"] }
aws-types = "1.3.11"
bytes = "1.11.0"
bytesize = "2.3.1"
chacha20poly1305 = "0.10.1"
clap = "4.5.54"
crossterm = "0.29.0"
console = "0.16.2"
dialoguer = "0.12.0"
dirs = "6.0.0"
hex-literal = "1.1.0"
indicatif = "0.18.3"
parse-size = "1.1.0"
rand_core = { version = "0.9.5", features = ["std"] }
regex = "1.12.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
schemars = "1.2.2"
jsonschema = { version = "0.52.0", default-features = false }
semver = "1.0.27"
sha2 = "0.10.9"
tabled = "0.20.0"
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5.0"
zstd = "0.13.3"
futures = "0.3.31"
chrono = "0.4.43"
num_cpus = "1.17.0"
notify = "8.2.0"
toml = "0.8.23"
percent-encoding = "2.3.1"
quick-xml = "0.37.5"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
url = "2.5.7"
encoding_rs = "0.8.35"
llama-cpp-2 = { version = "=0.1.154", default-features = false, features = ["common"] }
llama-cpp-sys-2 = { version = "=0.1.154", default-features = false, features = ["common"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
