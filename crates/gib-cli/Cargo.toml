[package]
name = "gib-cli"
version = "0.1.0"
edition = "2024"
description.workspace = true
publish = false

[[bin]]
name = "gib"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
gib-sdk = { path = "../gib-sdk", features = ["s3", "webdav"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
