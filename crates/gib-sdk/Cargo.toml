[package]
name = "gib-sdk"
version = "0.1.0"
edition = "2024"
description.workspace = true

[features]
default = []
async = ["dep:futures-util"]
s3 = ["dep:aws-sdk-s3", "dep:tokio"]
webdav = [
    "dep:futures-util",
    "dep:percent-encoding",
    "dep:quick-xml",
    "dep:reqwest",
    "dep:tokio",
]

[lib]
name = "gib"
path = "src/lib.rs"

[[bench]]
name = "chunking"
harness = false

[[bench]]
name = "transforms"
harness = false

[[bench]]
name = "packs"
harness = false

[[bench]]
name = "pack_indexes"
harness = false

[[bench]]
name = "trees"
harness = false

[dependencies]
aws-sdk-s3 = { version = "1.119.0", optional = true, features = ["behavior-version-latest"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
libc = "0.2.189"
getrandom = "0.2.17"
parse-size = "1.1.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
toml = "0.8.23"
tokio = { version = "1.49.0", optional = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = { version = "2.5.7" }
zstd = { version = "0.13.3", default-features = false }
zeroize = "1.8.2"
futures-util = { version = "0.3.31", optional = true, default-features = false, features = ["alloc", "async-await", "io", "std"] }
percent-encoding = { version = "2.3.1", optional = true }
quick-xml = { version = "0.37.5", optional = true }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
