[package]
name = "gib-sdk"
version = "0.1.0"
edition = "2024"
description.workspace = true

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:tokio", "dep:url"]

[lib]
name = "gib"
path = "src/lib.rs"

[dependencies]
aws-sdk-s3 = { version = "1.119.0", optional = true, features = ["behavior-version-latest"] }
libc = "0.2.189"
parse-size = "1.1.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
toml = "0.8.23"
tokio = { version = "1.49.0", optional = true, features = ["macros", "net", "rt", "sync", "time"] }
url = { version = "2.5.7", optional = true }
